name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The blocking gate: sandbox disabled, runs on any host.
          - mode: no-sandbox
            experimental: false
          # Investigation: does the sandbox work on the runner without extra privilege, or with SYS_ADMIN?
          - mode: default
            experimental: true
          - mode: sys-admin
            experimental: true
    name: test (${{ matrix.mode }})
    continue-on-error: ${{ matrix.experimental }}
    env:
      RUN_MODE: ${{ matrix.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Upload rendered output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-render-output-${{ matrix.mode }}
          path: tests/__output__/
          if-no-files-found: ignore
